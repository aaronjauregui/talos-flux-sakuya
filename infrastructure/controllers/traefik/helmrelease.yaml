apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: 41.6.0
      sourceRef:
        kind: HelmRepository
        name: traefik
  # Keep Traefik's own CRDs (crds/) in step with chart upgrades; Helm's
  # default is to install them once and never touch them again.
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Gateway API (HTTPRoute) as the default; the Ingress provider stays on for
    # charts that only ship Ingress objects. Gateway API CRDs come from infra-crds.
    providers:
      kubernetesGateway:
        enabled: true
    gateway:
      listeners:
        web:
          port: 8000
          protocol: HTTP
          namespacePolicy:
            from: All
    service:
      annotations:
        metallb.io/loadBalancerIPs: 192.168.1.230
      spec:
        # Deliver to the local pod without SNAT: apps see the real client IP.
        externalTrafficPolicy: Local
        # sakuya's NetBird IP (wt0, from the Talos netbird extension): kube-proxy
        # then catches :80/:443 on it just like on the LAN LB IP. Public DNS
        # (Porkbun) points here; the LAN router points at .230. (The chart has
        # no top-level service.externalIPs; spec is passed through verbatim.)
        externalIPs:
          - 100.81.132.122
