apiVersion: v1
kind: Namespace
metadata:
  name: metallb-system
  labels:
    # Talos enforces "baseline" PSA by default. The speaker needs hostNetwork
    # and NET_RAW (to answer ARP), which only "privileged" allows.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
