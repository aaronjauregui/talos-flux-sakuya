# vmalert: evaluates alert-rules.yaml against satori's VictoriaMetrics and
# sends firing alerts to satori's Alertmanager (routing/notifications live there).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vmalert
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: victoria-metrics-alert
      version: 0.49.0  # vmalert v1.152.0
      sourceRef:
        kind: HelmRepository
        name: vm
  values:
    server:
      datasource:
        url: http://satori.kinoko.house:8428
      notifier:
        url: http://satori.kinoko.house:9093
      # Alert state (how long a `for:` has been pending) is written to and restored
      # from VM, so a vmalert restart doesn't reset it.
      remoteWrite:
        url: http://satori.kinoko.house:8428
      remoteRead:
        url: http://satori.kinoko.house:8428
      configMap: vmalert-rules  # key alert-rules.yaml, mounted at /config
      extraArgs:
        external.label: cluster=sakuya  # on every alert, for Alertmanager routing
        configCheckInterval: 1m         # pick up rule changes without a restart
      resources:
        requests: {cpu: 10m, memory: 64Mi}
        limits: {memory: 256Mi}
