# kube-state-metrics: the state of k8s objects as metrics (kube_job_status_failed,
# kube_cronjob_status_last_successful_time, kube_pod_container_status_restarts_total, ...).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-state-metrics
      version: 8.5.0  # kube-state-metrics 2.20.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
---
# node-exporter: CPU/memory/disk of the node itself, same metrics as on
# cirno/gustaf/nitori, so satori's host rules cover sakuya too.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-node-exporter
      version: 4.57.0  # node_exporter 1.12.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
---
# blackbox-exporter: probes endpoints from the outside (HTTP status, TLS
# certificate expiry). vmagent passes the target per scrape; see job "blackbox".
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-exporter
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: 11.19.1  # blackbox_exporter 0.28.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
  values:
    fullnameOverride: blackbox-exporter
