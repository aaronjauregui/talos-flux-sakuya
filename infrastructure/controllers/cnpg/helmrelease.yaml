# CloudNativePG operator: watches Cluster/Backup/Pooler objects in all
# namespaces and runs Postgres for them. The Clusters themselves live with
# the apps that use them.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  interval: 1h
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.29.1  # operator 1.30.1
      sourceRef:
        kind: HelmRepository
        name: cnpg
  values:
    crds:
      create: true
---
# Barman Cloud plugin (CNPG-I): ships base backups + WAL to S3-compatible
# storage. Replaces the in-tree spec.backup.barmanObjectStore. The operator
# finds it through annotations on its Service and talks to it over mTLS gRPC.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: cnpg-system
spec:
  interval: 1h
  # The chart creates cert-manager Issuer/Certificates for that mTLS, and the
  # plugin must live next to the operator.
  dependsOn:
    - name: cnpg
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: plugin-barman-cloud
      version: 0.8.0  # plugin v0.15.0
      sourceRef:
        kind: HelmRepository
        name: cnpg
