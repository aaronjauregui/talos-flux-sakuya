# PITR experiment: a new cluster built from pg-demo's backups in R2, replayed
# up to just before "DROP TABLE notes" (08:22:34). No plugins/archiving here,
# so it can't write into pg-demo's backup path. Temporary.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-restore
  namespace: pg-demo
spec:
  instances: 1
  storage:
    size: 2Gi
  bootstrap:
    recovery:
      source: pg-demo-r2
      recoveryTarget:
        targetTime: "2026-09-25 08:22:32.332467+00"
  externalClusters:
    - name: pg-demo-r2
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: r2
          serverName: pg-demo  # folder in the bucket = source cluster's name
