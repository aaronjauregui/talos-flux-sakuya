# General-purpose Postgres for homelab apps, and the reference config for CNPG
# + backups to R2. Two instances on one node survive a pod/Postgres failure
# (replica promoted in ~1s), not a node failure.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-main
  namespace: postgres
spec:
  instances: 2
  storage:
    size: 2Gi  # StorageClass omitted -> default (local-path)
  bootstrap:
    initdb:
      database: app
      owner: app  # operator generates the password into Secret pg-main-app
  # Ship WAL continuously to the ObjectStore (the plugin runs as a sidecar in
  # each instance pod).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: r2
