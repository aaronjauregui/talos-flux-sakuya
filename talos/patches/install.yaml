# Install to the virtio disk using the Image Factory schematic that includes
# the qemu-guest-agent extension (same schematic as the boot ISO). Without
# this, the installed OS would silently drop the extension.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:v1.14.1
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
