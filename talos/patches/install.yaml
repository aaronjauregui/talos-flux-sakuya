# Install to the virtio disk using the Image Factory schematic from
# talos/schematic.yaml (qemu-guest-agent + netbird). Without this, the installed
# OS would silently drop the extensions.
apiVersion: v1alpha1
kind: UnattendedInstallConfig
installer:
  image: factory.talos.dev/metal-installer/6b089087bdbe2df70546241a00ff305587ac1f5e7ebaec05cbc4f05b2d9869e4:v1.14.1
provisioning:
  diskSelector:
    match: disk.dev_path == "/dev/sda"
